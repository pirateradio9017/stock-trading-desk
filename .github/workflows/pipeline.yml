name: Stock Trading Desk Pipeline & Cloud Sync

# Scheduled CI runs have been retired in favor of the always-on VPS daemon scheduler.
# Keep workflow_dispatch for manual emergency runs or Cloudflare Worker updates.
on:
  workflow_dispatch:
    inputs:
      skip_pipeline:
        description: "Skip Python research pipeline (use when only updating Worker)"
        required: false
        default: "false"
        type: boolean
      force_rebalance:
        description: "Force structural rebalance outside post-close research window"
        required: false
        default: "false"
        type: boolean
      deploy_worker:
        description: "Deploy Cloudflare Worker + SPA bundle"
        required: false
        default: "true"
        type: boolean
      disable_worker_cron:
        description: "Clear Cloudflare Worker Cron Triggers (recommended once VPS is active)"
        required: false
        default: "true"
        type: boolean
      vps_origin_url:
        description: "Optional VPS HTTPS origin URL for zero-KV Worker transparent proxy"
        required: false
        default: ""
        type: string

concurrency:
  group: stock-desk-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Resolve research schedule
        id: research-slot
        env:
          DESK_EVENT_NAME: ${{ github.event_name }}
          DESK_SCHEDULE: ${{ github.event.schedule }}
          DESK_SKIP_PIPELINE: ${{ inputs.skip_pipeline }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          from src.config import resolve_research_schedule

          skip_pipeline = os.environ.get("DESK_SKIP_PIPELINE", "").lower() == "true"
          decision = resolve_research_schedule(
              os.environ["DESK_EVENT_NAME"],
              os.environ["DESK_SCHEDULE"],
              datetime.now(timezone.utc),
          )
          should_run = decision.run and not skip_pipeline
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"run={str(should_run).lower()}", file=output)
              print(f"catchup_rebalance={str(decision.catchup_rebalance).lower()}", file=output)
          print(
              f"Research slot: {decision.session} / {decision.window}, "
              f"run={should_run}, skip={skip_pipeline}, catchup={decision.catchup_rebalance}, reason={decision.reason}"
          )
          PY

      - name: Install dependencies
        if: steps.research-slot.outputs.run == 'true' || inputs.deploy_worker == true
        run: |
          pip install --disable-pip-version-check -r requirements.txt

      - name: Run research pipeline and publish KV (DESK_STATE)
        if: steps.research-slot.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DESK_LLM_PROVIDER: auto
          DEEPSEEK_MODEL: deepseek-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ARGS="--publish-kv"
          if [ "${{ inputs.force_rebalance }}" = "true" ]; then
            ARGS="$ARGS --force-rebalance"
          elif [ "${{ steps.research-slot.outputs.catchup_rebalance }}" = "true" ]; then
            ARGS="$ARGS --catchup-rebalance"
          fi
          python -m src.pipeline $ARGS

      - name: Deploy Cloudflare Worker & SPA bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker == true }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_DISABLE_CRON: ${{ inputs.disable_worker_cron }}
          CF_VPS_ORIGIN_URL: ${{ inputs.vps_origin_url }}
        run: |
          python scripts/deploy_worker.py --no-data
