name: Stock Trading Desk Pipeline & Cloud Sync

on:
  schedule:
    - cron: "7 */4 * * *"
    - cron: "7 2,6,10,14,18,22 * * *"
    - cron: "32 13,16 * * 1-5"
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      force_rebalance:
        description: "Force structural rebalance outside post-close research window"
        required: false
        default: "false"
        type: boolean
      deploy_worker:
        description: "Deploy Cloudflare Worker + SPA bundle"
        required: false
        default: "true"
        type: boolean

concurrency:
  group: stock-desk-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Resolve research schedule
        id: research-slot
        env:
          DESK_EVENT_NAME: ${{ github.event_name }}
          DESK_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, time, timezone

          from src.config import TZ_ET, get_market_close, get_market_session, get_research_window, is_us_trading_day

          now = datetime.now(timezone.utc)
          et = now.astimezone(TZ_ET)
          session = get_market_session(now)
          window = get_research_window(now)
          schedule = os.environ["DESK_SCHEDULE"]
          catchup_rebalance = False
          if os.environ["DESK_EVENT_NAME"] == "workflow_dispatch" or schedule == "7 */4 * * *":
              run = True
          elif schedule == "32 13,16 * * 1-5":
              close_h = get_market_close(et.date()).hour
              if window == "REBALANCE_WINDOW":
                  run = True
              elif is_us_trading_day(et.date()) and time(close_h + 1, 0) <= et.time() < time(close_h + 1, 25):
                  # GitHub Actions queue delay slipped past the 30-min rebalance window; still execute once.
                  run = True
                  catchup_rebalance = True
              else:
                  run = False
          else:
              run = session in {"PRE_MARKET", "INTRADAY", "AFTER_HOURS"}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"run={str(run).lower()}", file=output)
              print(f"catchup_rebalance={str(catchup_rebalance).lower()}", file=output)
          print(f"Research slot: {session} / {window}, run={run}, catchup={catchup_rebalance}")
          PY

      - name: Install dependencies
        if: steps.research-slot.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run research pipeline and publish KV (DESK_STATE)
        if: steps.research-slot.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DESK_LLM_PROVIDER: deepseek
          DEEPSEEK_MODEL: deepseek-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          ARGS="--publish-kv"
          if [ "${{ inputs.force_rebalance }}" = "true" ] || [ "${{ steps.research-slot.outputs.catchup_rebalance }}" = "true" ]; then
            ARGS="$ARGS --force-rebalance"
          fi
          python -m src.pipeline $ARGS

      - name: Deploy Cloudflare Worker & SPA bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker == true }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python scripts/deploy_worker.py --no-data
